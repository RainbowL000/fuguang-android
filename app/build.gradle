plugins { id 'com.android.application' }
android {
    namespace 'com.fuguang.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fuguang.assistant'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }
    signingConfigs { debug { if (System.getenv('FUGUANG_KEYSTORE')) storeFile file(System.getenv('FUGUANG_KEYSTORE')) } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
